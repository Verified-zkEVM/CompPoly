name: Lean Action CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: >-
          Wipe .lake/build and run a full clean lake build before the warm path.
          Default CI is warm/incremental (reuse cached oleans). Clean also runs
          automatically when lean-toolchain or lake-manifest.json changes.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Benchmark groups CI runs. This is deliberately a subset: `lake exe CompPolyBench
  # --list` shows every registered group, and a new group is only covered here once
  # added below. An unknown key fails the run, so a renamed group is caught rather
  # than dropped.
  #
  # The step runs after the build it reuses, so its cost is wall-clock on this job
  # and nothing else. Benchmark *timings* are informational, but a checksum mismatch
  # or a harness-canary failure is a correctness signal and deliberately fails the
  # run, so this step has no `continue-on-error`.
  BENCH_CI_GROUPS: >-
    harness-floor,harness-canary,
    univariate-dense-koalabear,univariate-dense-babybear,
    univariate-sparse-koalabear,
    univariate-monic-remainder-small-koalabear,
    univariate-dense-goldilocks,univariate-dense-bn254,
    univariate-dense-bls12-381,univariate-dense-bls12-377,
    univariate-batch-small-koalabear,
    univariate-many-one-point-koalabear,
    univariate-mul-koalabear,univariate-mul-babybear,
    univariate-low-product-koalabear,
    univariate-roots-finite-field-koalabear,
    multivariate-dense-koalabear,multivariate-sparse-koalabear,
    multilinear-coeff-koalabear,multilinear-hypercube-koalabear,
    multilinear-many-mle-koalabear,
    bivariate-full-koalabear,bivariate-divlinear-koalabear-y32,
    guruswami-sudan-interp-small-koalabear,
    guruswami-sudan-root-koalabear,
    guruswami-sudan-core-small-koalabear,
    guruswami-sudan-filtered-core-small-koalabear,
    additive-ntt-btf3-l2-r2,additive-ntt-btf3-l4-r2,additive-ntt-btf4-l7-r2,
    fields-tower-bt128-mul,fields-tower-bt128-inv,
    fields-extension-koalabear-ext4-mul,fields-extension-koalabear-ext4-inv,
    fields-extension-babybear-ext4-mul,fields-extension-babybear-ext4-inv,
    fields-mont64x8-bn254-inv,fields-mont64x8-bls12-381-inv,
    fields-mont64x8-bls12-377-inv,
    fields-goldilocks-mul,fields-goldilocks-inv

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/build-timing.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/build-timing-logs" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_DIR=$RUNNER_TEMP/build-timing-artifact" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_NAME=build-timing-data" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASELINE_DIR=$RUNNER_TEMP/build-timing-baseline" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_REPORT=$RUNNER_TEMP/build-timing.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_COMMENT=$RUNNER_TEMP/build-timing-comment.md" >> "$GITHUB_ENV"
          echo "EVALUATION_BENCH_ARTIFACT_DIR=$RUNNER_TEMP/evaluation-bench-artifact" >> "$GITHUB_ENV"
          echo "EVALUATION_BENCH_ARTIFACT_NAME=evaluation-bench-results" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASE_REF=" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_MERGE_BASE_SHA=" >> "$GITHUB_ENV"
          {
            echo "BUILD_TIMING_SOURCE_SUBJECT<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Determine PR timing merge base
        if: github.event_name == 'pull_request'
        run: |
          echo "BUILD_TIMING_BASE_REF=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          merge_base_sha="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true)"
          if [ -n "$merge_base_sha" ]; then
            echo "BUILD_TIMING_MERGE_BASE_SHA=$merge_base_sha" >> "$GITHUB_ENV"
          fi
      # Default: warm/incremental builds (reuse oleans; Lake rebuilds only dirty modules).
      # Clean full rebuild when:
      #   - workflow_dispatch with clean_build: true, or
      #   - lean-toolchain or lake-manifest.json differs from the comparison base
      #     (PR base SHA, previous push tip, or merge-base with origin/main on dispatch).
      - name: Resolve clean-build flag
        run: |
          clean_build=false
          clean_reason=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.clean_build }}" = "true" ]; then
            clean_build=true
            clean_reason="workflow_dispatch clean_build input"
          fi

          # Version-lock bump: force a wipe even if a cache restore-key matched.
          # Cache keys already isolate toolchain+manifest, so misses are cold in
          # practice; explicit clean keeps timing/policy honest and defends against
          # key drift.
          if [ "$clean_build" != true ]; then
            base_ref=""
            case "${{ github.event_name }}" in
              pull_request)
                base_ref="${{ github.event.pull_request.base.sha }}"
                ;;
              push)
                before="${{ github.event.before }}"
                if [ -n "$before" ] && \
                   [ "$before" != "0000000000000000000000000000000000000000" ]; then
                  base_ref="$before"
                fi
                ;;
              workflow_dispatch)
                if git rev-parse --verify origin/main >/dev/null 2>&1; then
                  base_ref="$(git merge-base origin/main HEAD 2>/dev/null || true)"
                elif git rev-parse --verify origin/master >/dev/null 2>&1; then
                  base_ref="$(git merge-base origin/master HEAD 2>/dev/null || true)"
                fi
                ;;
            esac

            if [ -n "$base_ref" ] && git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              if ! git diff --quiet "$base_ref" HEAD -- lean-toolchain lake-manifest.json; then
                clean_build=true
                changed="$(git diff --name-only "$base_ref" HEAD -- lean-toolchain lake-manifest.json | tr '\n' ' ')"
                clean_reason="version lock changed vs ${base_ref:0:12} (${changed% })"
              fi
            fi
          fi

          echo "CLEAN_BUILD=$clean_build" >> "$GITHUB_ENV"
          if [ "$clean_build" = true ]; then
            echo "Clean build: will wipe .lake/build before lake build ($clean_reason)."
          else
            echo "Warm build (default): reuse cached .lake oleans; no wipe."
          fi
      # Warm builds only pay off when the restore actually hits, so dependencies and our
      # own build are cached separately.
      #
      # A single `path: .lake` entry carried both at ~2.6 GiB per commit. Keyed per
      # commit against GitHub's 10 GB per-repo quota, that left room for roughly four
      # entries, so consecutive pushes evicted one another and warm restores missed
      # often — the repo was sitting at ~10.3 GiB active, permanently over quota.
      # Splitting means the bulky dependency entry is written once per version-lock
      # bump instead of once per push, leaving the quota free to hold many small
      # per-commit build entries.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          # No commit component and no restore-keys: the version lock fully determines
          # the dependency set, so a hit is always exact and a miss must be refetched.
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          # Exact key per commit; restore-keys fall back to latest compatible
          # toolchain+manifest cache (typically main or a recent PR head).
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          # This step is what supplies Mathlib's oleans: lean-action detects the Mathlib
          # dependency in `lake-manifest.json` and runs `lake exe cache get` itself, so a
          # dependency-cache miss costs a download rather than compiling Mathlib. That is
          # already the behaviour of the `auto` default; setting it explicitly documents
          # the reliance and pins it against a future change of default.
          use-mathlib-cache: true
      - name: Time clean build
        if: env.CLEAN_BUILD == 'true'
        run: |
          bash scripts/build_timing_report.sh run clean_build "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'rm -rf .lake/build && lake build'
      - name: Time library build (warm)
        run: |
          bash scripts/build_timing_report.sh run warm_rebuild "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake build'
      - name: Time test path
        run: |
          bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake test'
      - name: Axiom sweep
        run: lake exe axiomsweep --check
      - name: Fail on build warnings
        continue-on-error: true
        run: lake build --wfail
      - name: Build evaluation benchmark executable
        run: lake build CompPolyBench
      - name: Run evaluation benchmarks
        # BENCH_CI_GROUPS is a folded YAML scalar, so strip the line-break whitespace
        # the folding introduces before handing it to --groups.
        run: |
          lake exe CompPolyBench --medium \
            --groups "$(printf '%s' "$BENCH_CI_GROUPS" | tr -d '[:space:]')"
      - name: Prepare evaluation benchmark artifact
        if: always()
        run: |
          rm -rf "$EVALUATION_BENCH_ARTIFACT_DIR"
          mkdir -p "$EVALUATION_BENCH_ARTIFACT_DIR"
          results=(bench/out/results-*.jsonl)
          reports=(bench/out/report-*.md)
          if [ -e "${results[0]}" ]; then
            cp "${results[@]}" "$EVALUATION_BENCH_ARTIFACT_DIR/"
          fi
          if [ -e "${reports[0]}" ]; then
            cp "${reports[@]}" "$EVALUATION_BENCH_ARTIFACT_DIR/"
            for report in "${reports[@]}"; do
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
      - name: Upload evaluation benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EVALUATION_BENCH_ARTIFACT_NAME }}
          path: ${{ env.EVALUATION_BENCH_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
      # Both saves skip on an exact cache hit, where the key is already stored and the
      # save would fail. In practice the dependency entry is written only after a
      # version-lock bump, while the build entry is written on every new commit so the
      # next PR can restore tip oleans via restore-keys.
      - name: Save dependency cache
        if: success() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Save build cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Prepare timing artifact
        if: always()
        run: |
          rm -rf "$BUILD_TIMING_ARTIFACT_DIR"
          mkdir -p "$BUILD_TIMING_ARTIFACT_DIR"
          if [ -f "$BUILD_TIMING_RESULTS" ]; then
            cp "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_ARTIFACT_DIR/results.jsonl"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/clean_build.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/clean_build.log" "$BUILD_TIMING_ARTIFACT_DIR/clean_build.log"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/warm_rebuild.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/warm_rebuild.log" "$BUILD_TIMING_ARTIFACT_DIR/warm_rebuild.log"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/test_path.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/test_path.log" "$BUILD_TIMING_ARTIFACT_DIR/test_path.log"
          fi
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
      - name: Determine comparison baseline artifact
        if: always() && github.event_name == 'pull_request'
        id: timing-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifactName = process.env.BUILD_TIMING_ARTIFACT_NAME;
            const workflowName = process.env.GITHUB_WORKFLOW;
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const currentSha = process.env.GITHUB_SHA;
            const pullRequest = context.payload.pull_request;
            const headRef = pullRequest.head.ref;
            const baseRef = process.env.BUILD_TIMING_BASE_REF;
            const mergeBaseSha = process.env.BUILD_TIMING_MERGE_BASE_SHA;

            async function firstRunWithArtifact(runs) {
              for (const run of runs) {
                if (run.id === currentRunId) {
                  continue;
                }
                if (run.name !== workflowName || run.conclusion !== 'success') {
                  continue;
                }
                const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const artifact = artifactsResponse.data.artifacts.find(candidate =>
                  candidate.name === artifactName && !candidate.expired
                );
                if (artifact) {
                  return run;
                }
              }
              return null;
            }

            const prRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'pull_request',
              branch: headRef,
              status: 'completed',
              per_page: 100,
            });
            const previousPrCandidates = prRunsResponse.data.workflow_runs.filter(run => {
              if (run.head_sha === currentSha) {
                return false;
              }
              const prs = run.pull_requests || [];
              return prs.length === 0 || prs.some(pr => pr.number === pullRequest.number);
            });
            const previousPrRun = await firstRunWithArtifact(previousPrCandidates);
            if (previousPrRun) {
              core.setOutput('run-id', String(previousPrRun.id));
              core.setOutput('sha', previousPrRun.head_sha);
              core.setOutput('label', 'the previous successful PR update');
              return;
            }

            const baseRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'push',
              branch: baseRef,
              status: 'completed',
              per_page: 100,
            });
            const baseCandidates = baseRunsResponse.data.workflow_runs.filter(run =>
              run.name === workflowName && run.conclusion === 'success'
            );
            const exactMergeBaseCandidates = mergeBaseSha
              ? baseCandidates.filter(run => run.head_sha === mergeBaseSha)
              : [];
            const exactMergeBaseRun =
              exactMergeBaseCandidates.length > 0
                ? await firstRunWithArtifact(exactMergeBaseCandidates)
                : null;
            const fallbackBaseCandidates = mergeBaseSha
              ? baseCandidates.filter(run => run.head_sha !== mergeBaseSha)
              : baseCandidates;
            const baseRun =
              exactMergeBaseRun ?? await firstRunWithArtifact(fallbackBaseCandidates);
            if (baseRun) {
              const isMergeBase = Boolean(mergeBaseSha) && baseRun.head_sha === mergeBaseSha;
              core.setOutput('run-id', String(baseRun.id));
              core.setOutput('sha', baseRun.head_sha);
              core.setOutput(
                'label',
                isMergeBase
                  ? `merge-base on \`${baseRef}\``
                  : `the latest successful \`${baseRef}\` run`
              );
              return;
            }

            core.info('No comparison baseline artifact found.');
            core.setOutput('run-id', '');
            core.setOutput('sha', '');
            core.setOutput('label', '');
      - name: Download comparison baseline artifact
        if: always() && steps.timing-baseline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_BASELINE_DIR }}
          run-id: ${{ steps.timing-baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Render build timing report
        if: always()
        env:
          BUILD_TIMING_BASELINE_LABEL: ${{ steps.timing-baseline.outputs.label }}
          BUILD_TIMING_BASELINE_SHA: ${{ steps.timing-baseline.outputs.sha }}
        run: |
          if [ -f "$BUILD_TIMING_BASELINE_DIR/results.jsonl" ]; then
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_BASELINE_DIR" > "$BUILD_TIMING_REPORT"
          else
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" > "$BUILD_TIMING_REPORT"
          fi
          cat "$BUILD_TIMING_REPORT" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- compoly-build-timing-report -->'
            echo
            cat "$BUILD_TIMING_REPORT"
          } > "$BUILD_TIMING_COMMENT"
      - name: Upsert build timing PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- compoly-build-timing-report -->';
            const body = fs.readFileSync(process.env.BUILD_TIMING_COMMENT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
