name: Lean Action CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: >-
          Wipe .lake/build and run a full clean lake build before the warm path.
          Default CI is warm/incremental (reuse cached oleans). Clean also runs
          automatically when lean-toolchain or lake-manifest.json changes.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build steps run this PR's Lean code (`#eval`, `initialize`, tactics); a token
          # left in `.git/config` would be readable from it.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Initialize timing paths
        run: |
          echo "BUILD_TIMING_RESULTS=$RUNNER_TEMP/build-timing.jsonl" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_LOG_DIR=$RUNNER_TEMP/build-timing-logs" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_DIR=$RUNNER_TEMP/build-timing-artifact" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_ARTIFACT_NAME=build-timing-data" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASELINE_DIR=$RUNNER_TEMP/build-timing-baseline" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_REPORT=$RUNNER_TEMP/build-timing.md" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_COMMENT=$RUNNER_TEMP/build-timing-comment.md" >> "$GITHUB_ENV"
          echo "EVALUATION_BENCH_ARTIFACT_DIR=$RUNNER_TEMP/evaluation-bench-artifact" >> "$GITHUB_ENV"
          echo "EVALUATION_BENCH_ARTIFACT_NAME=evaluation-bench-results" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_SOURCE_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_BASE_REF=" >> "$GITHUB_ENV"
          echo "BUILD_TIMING_MERGE_BASE_SHA=" >> "$GITHUB_ENV"
          {
            echo "BUILD_TIMING_SOURCE_SUBJECT<<EOF"
            git log -1 --format=%s
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Determine PR timing merge base
        if: github.event_name == 'pull_request'
        run: |
          echo "BUILD_TIMING_BASE_REF=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          merge_base_sha="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true)"
          if [ -n "$merge_base_sha" ]; then
            echo "BUILD_TIMING_MERGE_BASE_SHA=$merge_base_sha" >> "$GITHUB_ENV"
          fi
      # Default: warm/incremental builds (reuse oleans; Lake rebuilds only dirty modules).
      # Clean full rebuild when:
      #   - workflow_dispatch with clean_build: true, or
      #   - lean-toolchain or lake-manifest.json differs from the comparison base
      #     (PR base SHA, previous push tip, or merge-base with origin/main on dispatch).
      - name: Resolve clean-build flag
        run: |
          clean_build=false
          clean_reason=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.clean_build }}" = "true" ]; then
            clean_build=true
            clean_reason="workflow_dispatch clean_build input"
          fi

          # Version-lock bump: force a wipe even if a cache restore-key matched.
          # Cache keys already isolate toolchain+manifest, so misses are cold in
          # practice; explicit clean keeps timing/policy honest and defends against
          # key drift.
          if [ "$clean_build" != true ]; then
            base_ref=""
            case "${{ github.event_name }}" in
              pull_request)
                base_ref="${{ github.event.pull_request.base.sha }}"
                ;;
              push)
                before="${{ github.event.before }}"
                if [ -n "$before" ] && \
                   [ "$before" != "0000000000000000000000000000000000000000" ]; then
                  base_ref="$before"
                fi
                ;;
              workflow_dispatch)
                if git rev-parse --verify origin/main >/dev/null 2>&1; then
                  base_ref="$(git merge-base origin/main HEAD 2>/dev/null || true)"
                elif git rev-parse --verify origin/master >/dev/null 2>&1; then
                  base_ref="$(git merge-base origin/master HEAD 2>/dev/null || true)"
                fi
                ;;
            esac

            if [ -n "$base_ref" ] && git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              if ! git diff --quiet "$base_ref" HEAD -- lean-toolchain lake-manifest.json; then
                clean_build=true
                changed="$(git diff --name-only "$base_ref" HEAD -- lean-toolchain lake-manifest.json | tr '\n' ' ')"
                clean_reason="version lock changed vs ${base_ref:0:12} (${changed% })"
              fi
            fi
          fi

          echo "CLEAN_BUILD=$clean_build" >> "$GITHUB_ENV"
          if [ "$clean_build" = true ]; then
            echo "Clean build: will wipe .lake/build before lake build ($clean_reason)."
          else
            echo "Warm build (default): reuse cached .lake oleans; no wipe."
          fi
      # Warm builds only pay off when the restore actually hits, so dependencies and our
      # own build are cached separately.
      #
      # A single `path: .lake` entry carried both at ~2.6 GiB per commit. Keyed per
      # commit against GitHub's 10 GB per-repo quota, that left room for roughly four
      # entries, so consecutive pushes evicted one another and warm restores missed
      # often — the repo was sitting at ~10.3 GiB active, permanently over quota.
      # Splitting means the bulky dependency entry is written once per version-lock
      # bump instead of once per push, leaving the quota free to hold many small
      # per-commit build entries.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          # No commit component and no restore-keys: the version lock fully determines
          # the dependency set, so a hit is always exact and a miss must be refetched.
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          # Exact key per commit; restore-keys fall back to latest compatible
          # toolchain+manifest cache (typically main or a recent PR head).
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      # Recorded with every timing row: the report compares two runs only when their cache
      # states (and machines) match.
      - name: Record build cache state
        env:
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          if [ "$CLEAN_BUILD" = "true" ]; then
            state=clean
          elif [ "$CACHE_HIT" = "true" ]; then
            state=exact
          elif [ -n "$CACHE_MATCHED_KEY" ]; then
            state=partial
          else
            state=miss
          fi
          echo "BUILD_TIMING_CACHE_STATE=$state" >> "$GITHUB_ENV"
      - name: Set up Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          # This step is what supplies Mathlib's oleans: lean-action detects the Mathlib
          # dependency in `lake-manifest.json` and runs `lake exe cache get` itself, so a
          # dependency-cache miss costs a download rather than compiling Mathlib. That is
          # already the behaviour of the `auto` default; setting it explicitly documents
          # the reliance and pins it against a future change of default.
          use-mathlib-cache: true
      - name: Time clean build
        if: env.CLEAN_BUILD == 'true'
        run: |
          bash scripts/build_timing_report.sh run clean_build "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'rm -rf .lake/build && lake build'
      - name: Time library build (warm)
        run: |
          bash scripts/build_timing_report.sh run warm_rebuild "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake build'
      - name: Time test path
        run: |
          bash scripts/build_timing_report.sh run test_path "$BUILD_TIMING_RESULTS" -- \
            bash -eo pipefail -c 'lake test'
      - name: Build native field smoke test
        run: lake build --wfail CompPolyNativeSmoke
      - name: Check native field startup and arithmetic
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          ulimit -v 4194304
          ulimit -c 0
          timeout --kill-after=5s 30s .lake/build/bin/CompPolyNativeSmoke
      - name: Axiom sweep
        run: |
          mkdir -p "$RUNNER_TEMP/statement-export"
          lake exe axiomsweep --check --statements "$RUNNER_TEMP/statement-export/statements.json"
      # Every run keeps its statement export, so a pull request can diff against the run
      # of its base commit.
      - name: Upload statement export
        uses: actions/upload-artifact@v4
        with:
          name: statement-export
          path: ${{ runner.temp }}/statement-export/statements.json
          if-no-files-found: error
          retention-days: 90
          # A re-run uploads the same name again.
          overwrite: true
      # On a push, the kernel replay runs here. On a pull request it runs in the
      # `trusted-gates` job below, with the base revision's tooling, away from this PR's code.
      - name: Kernel replay
        if: github.event_name != 'pull_request'
        run: lake exe kernelreplay
      # Blocking: a `sorry` in an `example`, in a structure-field default, or anywhere in
      # the tests shows up as a "declaration uses `sorry`" warning even where no
      # kernel-level census can see it. The library and the tests build warning-free.
      - name: Fail on build warnings
        run: lake build --wfail && lake build --wfail CompPolyTests
      # The compiled library and tests, for the `trusted-gates` job. Nothing else of this
      # PR's build is passed on.
      - name: Upload the built library and tests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: compoly-oleans
          path: |
            .lake/build/lib/lean/CompPoly.olean*
            .lake/build/lib/lean/CompPoly/
            .lake/build/lib/lean/CompPolyTests.olean*
            .lake/build/lib/lean/CompPolyTests/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Build evaluation benchmark executable
        run: lake build CompPolyBench
      - name: Validate benchmark implementations
        # Correctness only: every implementation in a group runs over the same
        # inputs and must agree on a digest, so a wrong-but-fast implementation
        # fails here. No timings are collected -- this runner is a shared 2-vCPU
        # VM whose wall-clock is not worth gating on. Timings come from the
        # Benchmarks workflow, on demand.
        #
        # Deliberately no continue-on-error: a digest mismatch, or a harness
        # canary that has collapsed onto the loop floor, is a correctness failure.
        run: |
          groups="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' bench/ci-groups.txt \
            | grep -v '^$' | paste -sd, -)"
          lake exe CompPolyBench --medium --validate-only --groups "$groups"
      - name: Prepare benchmark validation artifact
        if: always()
        run: |
          rm -rf "$EVALUATION_BENCH_ARTIFACT_DIR"
          mkdir -p "$EVALUATION_BENCH_ARTIFACT_DIR"
          results=(bench/out/results-*.jsonl)
          reports=(bench/out/report-*.md)
          manifests=(bench/out/manifest-*.json)
          if [ -e "${results[0]}" ]; then
            cp "${results[@]}" "$EVALUATION_BENCH_ARTIFACT_DIR/"
          fi
          if [ -e "${manifests[0]}" ]; then
            cp "${manifests[@]}" "$EVALUATION_BENCH_ARTIFACT_DIR/"
          fi
          if [ -e "${reports[0]}" ]; then
            cp "${reports[@]}" "$EVALUATION_BENCH_ARTIFACT_DIR/"
            for report in "${reports[@]}"; do
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
      - name: Upload benchmark validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EVALUATION_BENCH_ARTIFACT_NAME }}
          path: ${{ env.EVALUATION_BENCH_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
      # Both saves skip on an exact cache hit, where the key is already stored and the
      # save would fail. In practice the dependency entry is written only after a
      # version-lock bump, while the build entry is written on every new commit so the
      # next PR can restore tip oleans via restore-keys.
      - name: Save dependency cache
        if: success() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Save build cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Prepare timing artifact
        if: always()
        run: |
          rm -rf "$BUILD_TIMING_ARTIFACT_DIR"
          mkdir -p "$BUILD_TIMING_ARTIFACT_DIR"
          if [ -f "$BUILD_TIMING_RESULTS" ]; then
            cp "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_ARTIFACT_DIR/results.jsonl"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/clean_build.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/clean_build.log" "$BUILD_TIMING_ARTIFACT_DIR/clean_build.log"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/warm_rebuild.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/warm_rebuild.log" "$BUILD_TIMING_ARTIFACT_DIR/warm_rebuild.log"
          fi
          if [ -f "$BUILD_TIMING_LOG_DIR/test_path.log" ]; then
            cp "$BUILD_TIMING_LOG_DIR/test_path.log" "$BUILD_TIMING_ARTIFACT_DIR/test_path.log"
          fi
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 30
      - name: Determine comparison baseline artifact
        if: always() && github.event_name == 'pull_request'
        id: timing-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifactName = process.env.BUILD_TIMING_ARTIFACT_NAME;
            const workflowName = process.env.GITHUB_WORKFLOW;
            const currentRunId = Number(process.env.GITHUB_RUN_ID);
            const currentSha = process.env.GITHUB_SHA;
            const pullRequest = context.payload.pull_request;
            const headRef = pullRequest.head.ref;
            const baseRef = process.env.BUILD_TIMING_BASE_REF;
            const mergeBaseSha = process.env.BUILD_TIMING_MERGE_BASE_SHA;

            async function firstRunWithArtifact(runs) {
              for (const run of runs) {
                if (run.id === currentRunId) {
                  continue;
                }
                if (run.name !== workflowName || run.conclusion !== 'success') {
                  continue;
                }
                const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const artifact = artifactsResponse.data.artifacts.find(candidate =>
                  candidate.name === artifactName && !candidate.expired
                );
                if (artifact) {
                  return run;
                }
              }
              return null;
            }

            const prRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'pull_request',
              branch: headRef,
              status: 'completed',
              per_page: 100,
            });
            const previousPrCandidates = prRunsResponse.data.workflow_runs.filter(run => {
              if (run.head_sha === currentSha) {
                return false;
              }
              const prs = run.pull_requests || [];
              return prs.length === 0 || prs.some(pr => pr.number === pullRequest.number);
            });
            const previousPrRun = await firstRunWithArtifact(previousPrCandidates);
            if (previousPrRun) {
              core.setOutput('run-id', String(previousPrRun.id));
              core.setOutput('sha', previousPrRun.head_sha);
              core.setOutput('label', 'the previous successful PR update');
              return;
            }

            const baseRunsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'push',
              branch: baseRef,
              status: 'completed',
              per_page: 100,
            });
            const baseCandidates = baseRunsResponse.data.workflow_runs.filter(run =>
              run.name === workflowName && run.conclusion === 'success'
            );
            const exactMergeBaseCandidates = mergeBaseSha
              ? baseCandidates.filter(run => run.head_sha === mergeBaseSha)
              : [];
            const exactMergeBaseRun =
              exactMergeBaseCandidates.length > 0
                ? await firstRunWithArtifact(exactMergeBaseCandidates)
                : null;
            const fallbackBaseCandidates = mergeBaseSha
              ? baseCandidates.filter(run => run.head_sha !== mergeBaseSha)
              : baseCandidates;
            const baseRun =
              exactMergeBaseRun ?? await firstRunWithArtifact(fallbackBaseCandidates);
            if (baseRun) {
              const isMergeBase = Boolean(mergeBaseSha) && baseRun.head_sha === mergeBaseSha;
              core.setOutput('run-id', String(baseRun.id));
              core.setOutput('sha', baseRun.head_sha);
              core.setOutput(
                'label',
                isMergeBase
                  ? `merge-base on \`${baseRef}\``
                  : `the latest successful \`${baseRef}\` run`
              );
              return;
            }

            core.info('No comparison baseline artifact found.');
            core.setOutput('run-id', '');
            core.setOutput('sha', '');
            core.setOutput('label', '');
      - name: Download comparison baseline artifact
        if: always() && steps.timing-baseline.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_TIMING_ARTIFACT_NAME }}
          path: ${{ env.BUILD_TIMING_BASELINE_DIR }}
          run-id: ${{ steps.timing-baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Find the base commit's statement export
        if: always() && github.event_name == 'pull_request'
        id: statement-base
        uses: actions/github-script@v7
        with:
          script: |
            // The PR is checked out as its merge commit, whose first parent is the base tip,
            // so the base tip's export is the one to compare against.
            const { owner, repo } = context.repo;
            const baseSha = context.payload.pull_request.base.sha;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, head_sha: baseSha, event: 'push', per_page: 100 }
            );
            for (const run of runs) {
              if (run.name !== process.env.GITHUB_WORKFLOW) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              if (artifacts.data.artifacts.some(a => a.name === 'statement-export' && !a.expired)) {
                core.setOutput('run-id', String(run.id));
                return;
              }
            }
            core.setOutput('run-id', '');
      - name: Download the base commit's statement export
        if: always() && steps.statement-base.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: statement-export
          path: ${{ runner.temp }}/statement-export-base
          run-id: ${{ steps.statement-base.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Diff statements against the base commit
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$RUNNER_TEMP/statement-export-base/statements.json"
          head="$RUNNER_TEMP/statement-export/statements.json"
          out="$RUNNER_TEMP/statement-diff.md"
          if [ -f "$base" ] && [ -f "$head" ]; then
            uv run --no-project --python 3.12 python scripts/statement_diff.py "$base" "$head" > "$out"
          else
            {
              echo "### Statement changes against the base revision"
              echo
              echo "Unavailable: base commit \`${BASE_SHA:0:12}\` has no statement export yet"
              echo "(its CI run may still be running or predate the export), or this run's"
              echo "sweep did not finish."
            } > "$out"
          fi
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Render build timing report
        if: always()
        env:
          BUILD_TIMING_BASELINE_LABEL: ${{ steps.timing-baseline.outputs.label }}
          BUILD_TIMING_BASELINE_SHA: ${{ steps.timing-baseline.outputs.sha }}
        run: |
          if [ -f "$BUILD_TIMING_BASELINE_DIR/results.jsonl" ]; then
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" "$BUILD_TIMING_BASELINE_DIR" > "$BUILD_TIMING_REPORT"
          else
            bash scripts/build_timing_report.sh render "$BUILD_TIMING_RESULTS" > "$BUILD_TIMING_REPORT"
          fi
          cat "$BUILD_TIMING_REPORT" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- compoly-build-timing-report -->'
            echo
            cat "$BUILD_TIMING_REPORT"
            if [ -f "$RUNNER_TEMP/statement-diff.md" ]; then
              echo
              cat "$RUNNER_TEMP/statement-diff.md"
            fi
          } > "$BUILD_TIMING_COMMENT"
      - name: Upsert build timing PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- compoly-build-timing-report -->';
            const body = fs.readFileSync(process.env.BUILD_TIMING_COMMENT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  # Checks that decide whether a pull request may widen the trust policy, run with the base
  # revision's checkout, scripts and Mathlib cache, and from the PR only its compiled
  # `.olean` files (the data being judged) and, last, its own kernel replay. The build job
  # above runs PR code (`#eval`, `initialize`, tactics) in the same process tree as
  # everything it does, so a check there can be tampered with.
  #
  # On `pull_request`, GitHub reads this job's definition from the PR's own copy of this
  # file. It is therefore only as trustworthy as the rule that a change to
  # `.github/workflows/` needs a code owner's review (CODEOWNERS plus branch protection's
  # "Require review from Code Owners"). Moving it to a `workflow_run` workflow, whose
  # definition comes from the default branch, would remove that dependency.
  trusted-gates:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      # Read as data only: the module list and the PR's kernel replay source.
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      # The PR's oleans only load under the toolchain and dependencies that built them. When
      # the PR changes either, use its lock files (as data: the base's lakefile and scripts
      # stay) and require sign-off below.
      - name: Compare toolchain and dependency lock
        id: lock
        run: |
          if cmp -s base/lean-toolchain head/lean-toolchain &&
             cmp -s base/lake-manifest.json head/lake-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The pull request changes lean-toolchain or lake-manifest.json; code-owner sign-off is required."
          fi
      # A lock change makes the steps below install the PR's toolchain and packages, whose
      # code (elan release binaries, lakefiles, Mathlib's cache tool) then runs in this job and
      # could tamper with any later step. So sign-off for it is checked first, before any of it
      # runs, and the PR's lock files are used only after it passes.
      - name: Require code-owner sign-off for the lock change
        if: steps.lock.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          REASON: it changes lean-toolchain or lake-manifest.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const why = `This pull request needs code-owner sign-off: ${process.env.REASON}. ` +
              `A user listed in the base revision's .github/CODEOWNERS, who is neither the PR ` +
              `author nor an author or committer of its commits, approves the PR at its ` +
              `current head commit; then re-run this job.`;
            const path = 'base/.github/CODEOWNERS';
            if (!fs.existsSync(path)) {
              core.setFailed(`${why} The base revision has no CODEOWNERS file.`);
              return;
            }
            const signers = new Set();
            for (const line of fs.readFileSync(path, 'utf8').split('\n')) {
              for (const entry of line.replace(/#.*/, '').trim().split(/\s+/).slice(1)) {
                if (entry.startsWith('@') && !entry.includes('/')) {
                  signers.add(entry.slice(1).toLowerCase());
                }
              }
            }
            const excluded = new Set([pr.user.login.toLowerCase()]);
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            for (const c of commits) {
              if (c.author?.login) excluded.add(c.author.login.toLowerCase());
              if (c.committer?.login && c.committer.login !== 'web-flow') {
                excluded.add(c.committer.login.toLowerCase());
              }
            }
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            // Each user's latest review decides; a later "changes requested" withdraws it.
            const latest = new Map();
            for (const r of reviews) {
              if (r.user && r.state !== 'COMMENTED') latest.set(r.user.login.toLowerCase(), r);
            }
            const ok = [...latest.values()].find(r =>
              r.state === 'APPROVED' &&
              r.commit_id === pr.head.sha &&
              r.user.type !== 'Bot' &&
              signers.has(r.user.login.toLowerCase()) &&
              !excluded.has(r.user.login.toLowerCase())
            );
            if (!ok) {
              core.setFailed(`${why} No such approval of ${pr.head.sha} was found.`);
            } else {
              core.notice(`Signed off by ${ok.user.login} at ${ok.submitted_at} on ${pr.head.sha}.`);
            }
      - name: Use the pull request's lock files
        if: steps.lock.outputs.changed == 'true'
        run: cp head/lean-toolchain head/lake-manifest.json base/
      - name: Set up Lean and Mathlib from the lock files chosen above
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: base
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Download the pull request's compiled library and tests
        uses: actions/download-artifact@v4
        with:
          name: compoly-oleans
          path: ${{ runner.temp }}/compoly-oleans
      # Only the library's and the tests' own build outputs may come from the PR: nothing that
      # could stand in for a Mathlib or core module on the search path, and no links.
      - name: Install them after checking their layout
        run: |
          src="$RUNNER_TEMP/compoly-oleans"
          bad="$(find "$src" -mindepth 1 \( -type l -o ! \( -type f -o -type d \) \) -print)"
          if [ -n "$bad" ]; then
            echo "::error::The olean artifact contains links or special files: $bad"
            exit 1
          fi
          for entry in "$src"/* "$src"/.[!.]*; do
            [ -e "$entry" ] || continue
            case "$(basename "$entry")" in
              CompPoly|CompPolyTests|CompPoly.*|CompPolyTests.*) ;;
              *) echo "::error::Unexpected entry in the olean artifact: $(basename "$entry")"; exit 1 ;;
            esac
          done
          mkdir -p base/.lake/build/lib/lean
          cp -R "$src"/. base/.lake/build/lib/lean/
      # Exit 1 means the sweep found taint the base baseline does not cover, which sign-off
      # can accept. Any other failure (it could not import, or crashed) fails here.
      - name: Axiom sweep under the base revision's policy
        id: base-sweep
        working-directory: base
        run: |
          set +e
          lake env lean --run scripts/AxiomSweep.lean --check --baseline scripts/axiom_baseline.json \
            > "$RUNNER_TEMP/sweep.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/sweep.log"
          # Exit 1 is sign-off-able only when the sweep actually ran (it prints its census
          # line before checking) and found only new sorry or axiom taint. Native-compiler
          # trust is never baselineable, and a script that failed to run proves nothing.
          ran=false; native=false
          grep -q '^axiomsweep: [0-9]* declarations across' "$RUNNER_TEMP/sweep.log" && ran=true
          grep -q 'never-allowlistable' "$RUNNER_TEMP/sweep.log" && native=true
          if [ "$status" = 0 ]; then
            echo "widened=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 1 ] && [ "$ran" = true ] && [ "$native" = false ]; then
            echo "widened=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The base revision's axiom sweep failed (status $status, ran=$ran, native trust=$native)"
            exit 1
          fi
      - name: List the pull request's modules
        run: |
          git -C head ls-files 'CompPoly/*.lean' 'tests/CompPolyTests/*.lean' |
            sed -e 's|^tests/||' -e 's|\.lean$||' -e 's|/|.|g' > "$RUNNER_TEMP/modules.txt"
          wc -l < "$RUNNER_TEMP/modules.txt"
      - name: Kernel replay with the base revision's tool
        working-directory: base
        run: |
          if [ -f scripts/KernelReplay.lean ]; then
            lake env lean --run scripts/KernelReplay.lean --self-script scripts/KernelReplay.lean \
              --require-modules "$RUNNER_TEMP/modules.txt"
          else
            echo "The base revision has no kernel replay; the pull request's runs below."
          fi
      # Sign-off for a wider policy: an approving
      # review of the PR's current head commit by a user the base revision's CODEOWNERS
      # lists, who is neither the PR author nor an author or committer of its commits, and
      # not a bot. A later push needs a new review.
      - name: Require code-owner sign-off
        if: steps.base-sweep.outputs.widened == 'true'
        env:
          REASON: the base revision's axiom sweep finds taint its baseline does not cover
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const why = `This pull request needs code-owner sign-off: ${process.env.REASON}. ` +
              `A user listed in the base revision's .github/CODEOWNERS, who is neither the PR ` +
              `author nor an author or committer of its commits, approves the PR at its ` +
              `current head commit; then re-run this job.`;
            const path = 'base/.github/CODEOWNERS';
            if (!fs.existsSync(path)) {
              core.setFailed(`${why} The base revision has no CODEOWNERS file.`);
              return;
            }
            const signers = new Set();
            for (const line of fs.readFileSync(path, 'utf8').split('\n')) {
              for (const entry of line.replace(/#.*/, '').trim().split(/\s+/).slice(1)) {
                if (entry.startsWith('@') && !entry.includes('/')) {
                  signers.add(entry.slice(1).toLowerCase());
                }
              }
            }
            const excluded = new Set([pr.user.login.toLowerCase()]);
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            for (const c of commits) {
              if (c.author?.login) excluded.add(c.author.login.toLowerCase());
              if (c.committer?.login && c.committer.login !== 'web-flow') {
                excluded.add(c.committer.login.toLowerCase());
              }
            }
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            // Each user's latest review decides; a later "changes requested" withdraws it.
            const latest = new Map();
            for (const r of reviews) {
              if (r.user && r.state !== 'COMMENTED') latest.set(r.user.login.toLowerCase(), r);
            }
            const ok = [...latest.values()].find(r =>
              r.state === 'APPROVED' &&
              r.commit_id === pr.head.sha &&
              r.user.type !== 'Bot' &&
              signers.has(r.user.login.toLowerCase()) &&
              !excluded.has(r.user.login.toLowerCase())
            );
            if (!ok) {
              core.setFailed(`${why} No such approval of ${pr.head.sha} was found.`);
            } else {
              core.notice(`Signed off by ${ok.user.login} at ${ok.submitted_at} on ${pr.head.sha}.`);
            }
      # This PR's own replay tool is PR code, so it runs last, after every verdict above.
      - name: Kernel replay with the pull request's tool
        working-directory: base
        run: |
          if [ ! -f ../head/scripts/KernelReplay.lean ]; then
            echo "The pull request has no kernel replay."
          elif cmp -s ../head/scripts/KernelReplay.lean scripts/KernelReplay.lean; then
            echo "Same tool as the base revision; already run."
          else
            cp ../head/scripts/KernelReplay.lean "$RUNNER_TEMP/KernelReplay.lean"
            lake env lean --run "$RUNNER_TEMP/KernelReplay.lean" \
              --self-script "$RUNNER_TEMP/KernelReplay.lean" \
              --require-modules "$RUNNER_TEMP/modules.txt"
          fi
